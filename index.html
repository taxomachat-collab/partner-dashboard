<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taxoma Partner Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    :root {
      --blue: #245fea;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e5eaf3;
      --soft: #f6f8fc;
      --danger: #be123c;
      --danger-bg: #fff1f2;
    }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(36, 95, 234, 0.12), transparent 34%),
        linear-gradient(180deg, #f8fbff 0%, #eef3f9 100%);
      color: var(--ink);
    }

    .page { min-height: 100vh; padding: 30px; }
    .shell { max-width: 1160px; margin: 0 auto; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
    }

    .logo {
      font-family: "Manrope", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 38px;
      font-weight: 600;
      letter-spacing: -0.035em;
      color: #111;
      line-height: 1;
    }

    .sublogo {
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 650;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill, .select, .lang-btn {
      padding: 9px 13px;
      border-radius: 999px;
      background: white;
      border: 1px solid var(--line);
      color: var(--blue);
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.04);
    }

    .select {
      appearance: none;
      cursor: pointer;
      color: var(--ink);
      padding-right: 30px;
    }

    .lang-btn {
      cursor: pointer;
      color: var(--muted);
    }

    .lang-btn.active {
      color: white;
      background: var(--blue);
      border-color: var(--blue);
    }

    .status {
      padding: 18px;
      background: white;
      border-radius: 20px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-weight: 700;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.06);
    }

    .error {
      background: var(--danger-bg);
      border-color: #fecdd3;
      color: var(--danger);
    }

    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #10245c 0%, #245fea 58%, #6b86ff 100%);
      border-radius: 30px;
      padding: 34px;
      color: white;
      box-shadow: 0 26px 70px rgba(36, 95, 234, 0.25);
      margin-bottom: 18px;
    }

    .hero.inactive {
      background: linear-gradient(135deg, #334155 0%, #64748b 100%);
      box-shadow: 0 26px 70px rgba(15, 23, 42, 0.16);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 999px;
      background: rgba(255,255,255,0.13);
      right: -110px;
      top: -120px;
    }

    .hero-top {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(34px, 5vw, 56px);
      letter-spacing: -0.065em;
      line-height: 0.96;
    }

    .hero p {
      margin: 0;
      opacity: 0.9;
      font-size: 16px;
      line-height: 1.5;
      max-width: 650px;
    }

    .hero-badge {
      white-space: nowrap;
      padding: 9px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.20);
      font-size: 13px;
      font-weight: 800;
    }

    .lifetime-note {
      margin-top: 14px;
      color: rgba(255,255,255,0.82);
      font-size: 13px;
      line-height: 1.45;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .card {
      background: rgba(255,255,255,0.9);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.055);
      backdrop-filter: blur(10px);
    }

    .card.highlight {
      border-color: rgba(36, 95, 234, 0.22);
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 9px;
    }

    .value {
      font-size: 29px;
      font-weight: 900;
      letter-spacing: -0.055em;
      line-height: 1.1;
    }

    .helper {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      margin-top: 8px;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .linkbox {
      padding: 14px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 17px;
      font-size: 14px;
      word-break: break-all;
      color: #334155;
      margin-top: 10px;
      line-height: 1.45;
    }

    .code {
      display: inline-flex;
      padding: 11px 15px;
      border-radius: 15px;
      background: #111827;
      color: white;
      font-weight: 900;
      letter-spacing: 0.045em;
      margin-top: 10px;
    }

    .message {
      padding: 15px;
      border-radius: 18px;
      background: var(--soft);
      border: 1px solid var(--line);
    }

    .message + .message { margin-top: 10px; }

    .message h3 {
      margin: 0 0 7px;
      font-size: 16px;
      letter-spacing: -0.02em;
    }

    .message p {
      margin: 0;
      color: #475569;
      line-height: 1.5;
      font-size: 14px;
    }

    .last-order {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .mini {
      padding: 13px;
      border-radius: 17px;
      background: var(--soft);
      border: 1px solid var(--line);
    }

    .mini strong {
      display: block;
      font-size: 15px;
      margin-top: 4px;
      letter-spacing: -0.02em;
    }

    .orders-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 16px;
      font-size: 14px;
    }

    .orders-table th,
    .orders-table td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .orders-table th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .orders-table tr:last-child td {
      border-bottom: 0;
    }

    @media (max-width: 900px) {
      .page { padding: 18px; }
      .grid { grid-template-columns: 1fr 1fr; }
      .two-col { grid-template-columns: 1fr; }
      .hero-top { flex-direction: column; }
      .last-order { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .top-actions { justify-content: flex-start; }
    }

    @media (max-width: 540px) {
      .grid { grid-template-columns: 1fr; }
      .hero { padding: 24px; border-radius: 24px; }
      .logo { font-size: 30px; }
      .orders-table { font-size: 13px; }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="shell">
      <div class="topbar">
        <div>
          <div class="logo">Taxoma</div>
          <div class="sublogo" id="subtitle">Partner dashboard</div>
        </div>

        <div class="top-actions">
          <select class="select" id="periodSelect"></select>
          <button class="lang-btn" id="csBtn" type="button">CZ</button>
          <button class="lang-btn" id="ukBtn" type="button">UA</button>
          <div class="pill" id="partnerRef">Načítám…</div>
        </div>
      </div>

      <section id="content" class="status">
        Načítám data partnera…
      </section>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search)
    const ref = params.get("ref") || "test"
    const lang = params.get("lang") || "cs"
    const selectedPeriod = params.get("period") || currentPeriod()

    const translations = {
      cs: {
        loading: "Načítám data partnera…",
        dashboardSubtitle: "Partner dashboard",
        activePartner: "Aktivní partner",
        inactivePartner: "Neaktivní partner",
        heroText: "Přehled provizí, objednávek a referral odkazu. Čísla se zobrazují pro vybrané období.",
        inactiveText: "Tento partner je momentálně deaktivovaný. Referral data zůstávají viditelná, ale nové konverze by neměly být připisovány.",
        pending: "Čekající provize",
        pendingHelp: "Čeká na schválení",
        approved: "Schválené provize",
        approvedHelp: "Připraveno k vyplacení",
        paid: "Vyplaceno",
        paidHelp: "Už odesláno partnerovi",
        orders: "Objednávky",
        ordersHelp: "Za vybrané období",
        referralLink: "Referral odkaz",
        discountCode: "Slevový kód",
        lastOrder: "Poslední objednávka",
        date: "Datum",
        serviceType: "Typ služby",
        commission: "Provize",
        status: "Status",
        noLastOrder: "Zatím žádná",
        notSet: "Není nastaveno",
        messages: "Zprávy",
        noMessages: "Žádné zprávy",
        noMessagesText: "Zatím tu nejsou žádné aktuality.",
        messageFallback: "Zpráva",
        vatReturn: "Přiznání k DPH",
        registration: "Registrace IO",
        lifetime: "Celkem od začátku",
        lifetimeOrders: "objednávek",
        lifetimePending: "čekající provize",
        orderHistory: "Historie objednávek",
        noOrders: "V tomto období zatím nejsou žádné objednávky.",
        loadError: "Nepodařilo se načíst dashboard"
      },
      uk: {
        loading: "Завантаження даних партнера…",
        dashboardSubtitle: "Партнерська панель",
        activePartner: "Активний партнер",
        inactivePartner: "Неактивний партнер",
        heroText: "Огляд комісій, замовлень і реферального посилання. Дані показуються для вибраного періоду.",
        inactiveText: "Цей партнер зараз деактивований. Реферальні дані залишаються видимими, але нові конверсії не повинні зараховуватися.",
        pending: "Очікувані комісії",
        pendingHelp: "Очікує підтвердження",
        approved: "Підтверджені комісії",
        approvedHelp: "Готово до виплати",
        paid: "Виплачено",
        paidHelp: "Вже виплачено партнеру",
        orders: "Замовлення",
        ordersHelp: "За вибраний період",
        referralLink: "Реферальне посилання",
        discountCode: "Промокод",
        lastOrder: "Останнє замовлення",
        date: "Дата",
        serviceType: "Тип послуги",
        commission: "Комісія",
        status: "Статус",
        noLastOrder: "Поки немає",
        notSet: "Не налаштовано",
        messages: "Повідомлення",
        noMessages: "Немає повідомлень",
        noMessagesText: "Поки що немає новин.",
        messageFallback: "Повідомлення",
        vatReturn: "Декларація з ПДВ",
        registration: "Реєстрація IO",
        lifetime: "Загалом від початку",
        lifetimeOrders: "замовлень",
        lifetimePending: "очікувані комісії",
        orderHistory: "Історія замовлень",
        noOrders: "У цьому періоді поки немає замовлень.",
        loadError: "Не вдалося завантажити панель"
      }
    }

    const t = translations[lang] || translations.cs

    document.documentElement.lang = lang
    document.getElementById("subtitle").textContent = t.dashboardSubtitle

    const content = document.getElementById("content")
    const partnerRef = document.getElementById("partnerRef")
    const periodSelect = document.getElementById("periodSelect")
    const csBtn = document.getElementById("csBtn")
    const ukBtn = document.getElementById("ukBtn")

    content.textContent = t.loading
    partnerRef.textContent = t.loading

    csBtn.classList.toggle("active", lang === "cs")
    ukBtn.classList.toggle("active", lang === "uk")

    csBtn.onclick = () => updateUrl({ lang: "cs" })
    ukBtn.onclick = () => updateUrl({ lang: "uk" })

    function currentPeriod() {
      const d = new Date()
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`
    }

    function generatePeriods(count = 18) {
      const result = []
      const d = new Date()
      d.setDate(1)

      for (let i = 0; i < count; i++) {
        const value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`
        result.push(value)
        d.setMonth(d.getMonth() - 1)
      }

      return result
    }

    function periodLabel(period) {
      const [year, month] = String(period || currentPeriod()).split("-")
      const date = new Date(Number(year), Number(month) - 1, 1)
      return new Intl.DateTimeFormat(lang === "uk" ? "uk-UA" : "cs-CZ", {
        month: "long",
        year: "numeric"
      }).format(date)
    }

    function setupPeriodSelect() {
      const periods = generatePeriods()
      periodSelect.innerHTML = periods.map(p => `
        <option value="${p}" ${p === selectedPeriod ? "selected" : ""}>${periodLabel(p)}</option>
      `).join("")

      periodSelect.onchange = () => updateUrl({ period: periodSelect.value })
    }

    function updateUrl(changes) {
      const next = new URLSearchParams(window.location.search)
      next.set("ref", ref)
      next.set("lang", changes.lang || lang)
      next.set("period", changes.period || selectedPeriod)
      window.location.search = next.toString()
    }

    function safeNumber(value) {
      const number = Number(value)
      return Number.isFinite(number) ? number : 0
    }

    function money(value) {
      const number = safeNumber(value) / 100
      return new Intl.NumberFormat(lang === "uk" ? "uk-UA" : "cs-CZ", {
        style: "currency",
        currency: "CZK",
        maximumFractionDigits: 0
      }).format(number)
    }

    function normalizeArray(value) {
      if (!value) return []
      if (Array.isArray(value)) return value
      if (value.data) return Array.isArray(value.data) ? value.data : [value.data]
      if (value.Record) return Array.isArray(value.Record) ? value.Record : [value.Record]
      return []
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;")
    }

    function isActive(value) {
      if (value === true) return true
      if (value === false) return false

      const normalized = String(value || "").toLowerCase().trim()
      if (normalized === "true" || normalized === "1" || normalized === "yes") return true
      if (normalized === "false" || normalized === "0" || normalized === "no") return false

      return true
    }

    function serviceName(type) {
      const value = String(type || "").toLowerCase()

      if (value.includes("register") || value.includes("registrace") || value.includes("registration")) return t.registration
      if (value.includes("vat_return") || value.includes("priznani") || value.includes("přiznání")) return t.vatReturn

      return type || t.noLastOrder
    }

    function formatDate(value) {
      if (!value) return t.noLastOrder

      const d = new Date(value)
      if (Number.isNaN(d.getTime())) return String(value)

      return new Intl.DateTimeFormat(lang === "uk" ? "uk-UA" : "cs-CZ", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }).format(d)
    }

    function renderOrders(orders) {
      if (!orders.length) {
        return `<div class="message"><h3>${t.noOrders}</h3></div>`
      }

      return `
        <table class="orders-table">
          <thead>
            <tr>
              <th>${t.date}</th>
              <th>${t.serviceType}</th>
              <th>${t.commission}</th>
              <th>${t.status}</th>
            </tr>
          </thead>
          <tbody>
            ${orders.map(order => `
              <tr>
                <td>${escapeHtml(formatDate(order.created_at))}</td>
                <td>${escapeHtml(serviceName(order.action))}</td>
                <td>${money(order.commission_amount)}</td>
                <td>${escapeHtml(order.commission_status || "pending")}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `
    }

    async function loadDashboard() {
      try {
        setupPeriodSelect()

        const apiUrl = `/api/get-partner-data?ref=${encodeURIComponent(ref)}&period=${encodeURIComponent(selectedPeriod)}`
        const res = await fetch(apiUrl)
        const data = await res.json()

        if (!res.ok || data.error) {
          throw new Error(data.error || t.loadError)
        }

        const partner = data.partner || {}
        const lifetimeStats = data.lifetime_stats || {}
        const periodStats = data.period_stats || {}
        const messages = normalizeArray(data.messages)
        const orders = normalizeArray(data.orders)
        const active = isActive(partner.active)

        const lastOrder = {
          at: periodStats.last_order_at || "",
          type: periodStats.last_order_type || "",
          commission_amount: periodStats.last_commission_amount || 0
        }

        partnerRef.textContent = `ref: ${partner.ref || ref}`

        const messageHtml = messages.length
          ? messages.map(m => `
              <div class="message">
                <h3>${escapeHtml(m.title || t.messageFallback)}</h3>
                <p>${escapeHtml(m.message || "")}</p>
              </div>
            `).join("")
          : `<div class="message"><h3>${t.noMessages}</h3><p>${t.noMessagesText}</p></div>`

        content.className = ""
        content.innerHTML = `
          <section class="hero ${active ? "" : "inactive"}">
            <div class="hero-top">
              <div>
                <h1>${escapeHtml(partner.name || "Partner")}</h1>
                <p>${active ? t.heroText : t.inactiveText}</p>
                <div class="lifetime-note">
                  ${t.lifetime}: ${safeNumber(lifetimeStats.orders_total)} ${t.lifetimeOrders} · ${money(lifetimeStats.pending)} ${t.lifetimePending}
                </div>
              </div>
              <div class="hero-badge">${active ? t.activePartner : t.inactivePartner}</div>
            </div>
          </section>

          <section class="grid">
            <div class="card highlight">
              <div class="label">${t.pending}</div>
              <div class="value">${money(periodStats.pending)}</div>
              <div class="helper">${t.pendingHelp}</div>
            </div>

            <div class="card">
              <div class="label">${t.approved}</div>
              <div class="value">${money(periodStats.approved)}</div>
              <div class="helper">${t.approvedHelp}</div>
            </div>

            <div class="card">
              <div class="label">${t.paid}</div>
              <div class="value">${money(periodStats.paid)}</div>
              <div class="helper">${t.paidHelp}</div>
            </div>

            <div class="card">
              <div class="label">${t.orders}</div>
              <div class="value">${safeNumber(periodStats.orders_total)}</div>
              <div class="helper">${t.ordersHelp}</div>
            </div>
          </section>

          <section class="two-col">
            <div class="card">
              <div class="label">${t.referralLink}</div>
              <div class="linkbox">${escapeHtml(partner.referral_url || t.notSet)}</div>

              <div style="height:18px"></div>

              <div class="label">${t.discountCode}</div>
              <div class="code">${escapeHtml(partner.discount_code || t.notSet)}</div>

              <div style="height:22px"></div>

              <div class="label">${t.lastOrder}</div>
              <div class="last-order">
                <div class="mini">
                  <div class="helper">${t.date}</div>
                  <strong>${escapeHtml(formatDate(lastOrder.at))}</strong>
                </div>
                <div class="mini">
                  <div class="helper">${t.serviceType}</div>
                  <strong>${escapeHtml(serviceName(lastOrder.type))}</strong>
                </div>
                <div class="mini">
                  <div class="helper">${t.commission}</div>
                  <strong>${money(lastOrder.commission_amount)}</strong>
                </div>
              </div>
            </div>

            <div class="card">
              <div class="label">${t.messages}</div>
              ${messageHtml}
            </div>
          </section>

          <section class="card">
            <div class="label">${t.orderHistory}</div>
            ${renderOrders(orders)}
          </section>
        `
      } catch (err) {
        content.className = "status error"
        content.textContent = err.message || t.loadError
      }
    }

    loadDashboard()
  </script>
</body>
</html>
