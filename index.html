<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taxoma Partner Dashboard</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f7fb;
      color: #111827;
    }

    .page {
      min-height: 100vh;
      padding: 32px;
    }

    .shell {
      max-width: 1120px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .brand {
      font-size: 22px;
      font-weight: 850;
      letter-spacing: -0.04em;
    }

    .pill {
      padding: 8px 12px;
      border-radius: 999px;
      background: #eaf0ff;
      color: #245fea;
      font-size: 13px;
      font-weight: 750;
    }

    .hero {
      background: linear-gradient(135deg, #245fea 0%, #5b7cfa 100%);
      border-radius: 28px;
      padding: 34px;
      color: white;
      box-shadow: 0 24px 60px rgba(36, 95, 234, 0.22);
      margin-bottom: 24px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(34px, 5vw, 56px);
      letter-spacing: -0.06em;
      line-height: 1;
    }

    .hero p {
      margin: 0;
      opacity: 0.9;
      font-size: 17px;
      line-height: 1.45;
      max-width: 680px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      border: 1px solid #e5eaf3;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.05);
    }

    .label {
      color: #64748b;
      font-size: 13px;
      font-weight: 750;
      margin-bottom: 8px;
    }

    .value {
      font-size: 28px;
      font-weight: 850;
      letter-spacing: -0.04em;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 16px;
    }

    .linkbox {
      padding: 14px;
      background: #f8fafc;
      border: 1px solid #e5eaf3;
      border-radius: 16px;
      font-size: 14px;
      word-break: break-all;
      color: #334155;
      margin-top: 10px;
      line-height: 1.45;
    }

    .code {
      display: inline-flex;
      padding: 10px 14px;
      border-radius: 14px;
      background: #111827;
      color: white;
      font-weight: 850;
      letter-spacing: 0.04em;
      margin-top: 10px;
    }

    .message {
      padding: 16px;
      border-radius: 18px;
      background: #f8fafc;
      border: 1px solid #e5eaf3;
    }

    .message + .message {
      margin-top: 10px;
    }

    .message h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    .message p {
      margin: 0;
      color: #475569;
      line-height: 1.5;
    }

    .status {
      padding: 18px;
      background: white;
      border-radius: 18px;
      border: 1px solid #e5eaf3;
      color: #64748b;
      font-weight: 650;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.05);
    }

    .error {
      background: #fff1f2;
      border-color: #fecdd3;
      color: #be123c;
    }

    @media (max-width: 850px) {
      .page { padding: 18px; }
      .grid { grid-template-columns: 1fr 1fr; }
      .two-col { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; gap: 12px; flex-direction: column; }
    }

    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
      .hero { padding: 24px; border-radius: 22px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="shell">
      <div class="topbar">
        <div class="brand">Taxoma Partner Dashboard</div>
        <div class="pill" id="partnerRef">Načítám…</div>
      </div>

      <section id="content" class="status">
        Načítám data partnera…
      </section>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search)
    const ref = params.get("ref") || "test"

    const content = document.getElementById("content")
    const partnerRef = document.getElementById("partnerRef")

    function formatCzkFromCents(value) {
      const number = Number(value || 0) / 100
      return new Intl.NumberFormat("cs-CZ", {
        style: "currency",
        currency: "CZK",
        maximumFractionDigits: 0
      }).format(number)
    }

    function normalizeMessages(messages) {
      if (!messages) return []

      if (Array.isArray(messages)) return messages

      if (messages.data) return [messages.data]

      if (messages.Record) return [messages.Record]

      return []
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;")
    }

    async function loadDashboard() {
      try {
        const res = await fetch(`/api/get-partner-data?ref=${encodeURIComponent(ref)}`)
        const data = await res.json()

        if (!res.ok || data.error) {
          throw new Error(data.error || "Nepodařilo se načíst dashboard")
        }

        const partner = data.partner || {}
        const messages = normalizeMessages(data.messages)

        partnerRef.textContent = `ref: ${partner.ref || ref}`

        const messageHtml = messages.length
          ? messages.map(m => `
              <div class="message">
                <h3>${escapeHtml(m.title || "Zpráva")}</h3>
                <p>${escapeHtml(m.message || "")}</p>
              </div>
            `).join("")
          : `<div class="message"><h3>Žádné zprávy</h3><p>Zatím tu nejsou žádné aktuality.</p></div>`

        content.className = ""
        content.innerHTML = `
          <section class="hero">
            <h1>${escapeHtml(partner.name || "Partner")}</h1>
            <p>Přehled affiliate odkazu, slevového kódu, provizí a zpráv od Taxomy.</p>
          </section>

          <section class="grid">
            <div class="card">
              <div class="label">Čekající provize</div>
              <div class="value">${formatCzkFromCents(data.stats?.pending || 0)}</div>
            </div>
            <div class="card">
              <div class="label">Schválené provize</div>
              <div class="value">${formatCzkFromCents(data.stats?.approved || 0)}</div>
            </div>
            <div class="card">
              <div class="label">Vyplaceno</div>
              <div class="value">${formatCzkFromCents(data.stats?.paid || 0)}</div>
            </div>
            <div class="card">
              <div class="label">Objednávky</div>
              <div class="value">${data.stats?.orders_total || 0}</div>
            </div>
          </section>

          <section class="two-col">
            <div class="card">
              <div class="label">Referral odkaz</div>
              <div class="linkbox">${escapeHtml(partner.referral_url || "Není nastaveno")}</div>

              <div style="height:18px"></div>

              <div class="label">Slevový kód</div>
              <div class="code">${escapeHtml(partner.discount_code || "Není nastaveno")}</div>
            </div>

            <div class="card">
              <div class="label">Zprávy</div>
              ${messageHtml}
            </div>
          </section>
        `
      } catch (err) {
        content.className = "status error"
        content.textContent = err.message
      }
    }

    loadDashboard()
  </script>
</body>
</html>
