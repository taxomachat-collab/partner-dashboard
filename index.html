<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taxoma Partner Dashboard</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --blue: #245fea;
      --blue-dark: #1744b8;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e5eaf3;
      --soft: #f6f8fc;
      --card: #ffffff;
    }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(36, 95, 234, 0.12), transparent 34%),
        linear-gradient(180deg, #f8fbff 0%, #eef3f9 100%);
      color: var(--ink);
    }

    .page {
      min-height: 100vh;
      padding: 30px;
    }

    .shell {
      max-width: 1160px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .logo {
  font-family: "Manrope", sans-serif;
  font-size: 38px;
  font-weight: 600;
  letter-spacing: -0.03em;
  color: #111;
}

    .sublogo {
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 650;
    }

    .pill {
      padding: 9px 13px;
      border-radius: 999px;
      background: white;
      border: 1px solid var(--line);
      color: var(--blue);
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.04);
    }

    .status {
      padding: 18px;
      background: white;
      border-radius: 20px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-weight: 700;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.06);
    }

    .error {
      background: #fff1f2;
      border-color: #fecdd3;
      color: #be123c;
    }

    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #10245c 0%, #245fea 58%, #6b86ff 100%);
      border-radius: 30px;
      padding: 34px;
      color: white;
      box-shadow: 0 26px 70px rgba(36, 95, 234, 0.25);
      margin-bottom: 18px;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 999px;
      background: rgba(255,255,255,0.13);
      right: -110px;
      top: -120px;
    }

    .hero-top {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(34px, 5vw, 56px);
      letter-spacing: -0.065em;
      line-height: 0.96;
    }

    .hero p {
      margin: 0;
      opacity: 0.9;
      font-size: 16px;
      line-height: 1.5;
      max-width: 650px;
    }

    .hero-badge {
      white-space: nowrap;
      padding: 9px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.20);
      font-size: 13px;
      font-weight: 800;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .card {
      background: rgba(255,255,255,0.9);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.055);
      backdrop-filter: blur(10px);
    }

    .card.highlight {
      border-color: rgba(36, 95, 234, 0.22);
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 9px;
    }

    .value {
      font-size: 29px;
      font-weight: 900;
      letter-spacing: -0.055em;
      line-height: 1.1;
    }

    .helper {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      margin-top: 8px;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 14px;
    }

    .linkbox {
      padding: 14px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 17px;
      font-size: 14px;
      word-break: break-all;
      color: #334155;
      margin-top: 10px;
      line-height: 1.45;
    }

    .code {
      display: inline-flex;
      padding: 11px 15px;
      border-radius: 15px;
      background: #111827;
      color: white;
      font-weight: 900;
      letter-spacing: 0.045em;
      margin-top: 10px;
    }

    .message {
      padding: 15px;
      border-radius: 18px;
      background: var(--soft);
      border: 1px solid var(--line);
    }

    .message + .message { margin-top: 10px; }

    .message h3 {
      margin: 0 0 7px;
      font-size: 16px;
      letter-spacing: -0.02em;
    }

    .message p {
      margin: 0;
      color: #475569;
      line-height: 1.5;
      font-size: 14px;
    }

    .last-order {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .mini {
      padding: 13px;
      border-radius: 17px;
      background: var(--soft);
      border: 1px solid var(--line);
    }

    .mini strong {
      display: block;
      font-size: 15px;
      margin-top: 4px;
      letter-spacing: -0.02em;
    }

    @media (max-width: 900px) {
      .page { padding: 18px; }
      .grid { grid-template-columns: 1fr 1fr; }
      .two-col { grid-template-columns: 1fr; }
      .hero-top { flex-direction: column; }
      .last-order { grid-template-columns: 1fr; }
    }

    @media (max-width: 540px) {
      .grid { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; gap: 12px; flex-direction: column; }
      .hero { padding: 24px; border-radius: 24px; }
      .logo { font-size: 30px; }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="shell">
      <div class="topbar">
        <div>
          <div class="logo">Taxoma</div>
          <div class="sublogo">Partner dashboard</div>
        </div>
        <div class="pill" id="partnerRef">Načítám…</div>
      </div>

      <section id="content" class="status">
        Načítám data partnera…
      </section>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search)
    const ref = params.get("ref") || "test"

    const content = document.getElementById("content")
    const partnerRef = document.getElementById("partnerRef")

    function money(value) {
      const number = Number(value || 0) / 100
      return new Intl.NumberFormat("cs-CZ", {
        style: "currency",
        currency: "CZK",
        maximumFractionDigits: 0
      }).format(number)
    }

    function normalizeMessages(messages) {
      if (!messages) return []
      if (Array.isArray(messages)) return messages
      if (messages.data) return [messages.data]
      if (messages.Record) return [messages.Record]
      return []
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;")
    }

    function serviceName(type) {
      const value = String(type || "").toLowerCase()

      if (value.includes("register") || value.includes("registrace")) return "Registrace IO"
      if (value.includes("vat_return") || value.includes("priznani") || value.includes("přiznání")) return "Přiznání k DPH"

      return type || "Zatím není"
    }

    async function loadDashboard() {
      try {
        const res = await fetch(`/api/get-partner-data?ref=${encodeURIComponent(ref)}`)
        const data = await res.json()

        if (!res.ok || data.error) {
          throw new Error(data.error || "Nepodařilo se načíst dashboard")
        }

        const partner = data.partner || {}
        const stats = data.stats || {}
        const lastOrder = data.last_order || {}
        const messages = normalizeMessages(data.messages)

        partnerRef.textContent = `ref: ${partner.ref || ref}`

        const messageHtml = messages.length
          ? messages.map(m => `
              <div class="message">
                <h3>${escapeHtml(m.title || "Zpráva")}</h3>
                <p>${escapeHtml(m.message || "")}</p>
              </div>
            `).join("")
          : `<div class="message"><h3>Žádné zprávy</h3><p>Zatím tu nejsou žádné aktuality.</p></div>`

        content.className = ""
        content.innerHTML = `
          <section class="hero">
            <div class="hero-top">
              <div>
                <h1>${escapeHtml(partner.name || "Partner")}</h1>
                <p>Přehled provizí, objednávek a referral odkazu. Čísla se aktualizují podle zaplacených objednávek.</p>
              </div>
              <div class="hero-badge">Aktivní partner</div>
            </div>
          </section>

          <section class="grid">
            <div class="card highlight">
              <div class="label">Čekající provize</div>
              <div class="value">${money(stats.pending)}</div>
              <div class="helper">Čeká na schválení</div>
            </div>

            <div class="card">
              <div class="label">Schválené provize</div>
              <div class="value">${money(stats.approved)}</div>
              <div class="helper">Připraveno k vyplacení</div>
            </div>

            <div class="card">
              <div class="label">Vyplaceno</div>
              <div class="value">${money(stats.paid)}</div>
              <div class="helper">Už odesláno partnerovi</div>
            </div>

            <div class="card">
              <div class="label">Objednávky</div>
              <div class="value">${Number(stats.orders_total || 0)}</div>
              <div class="helper">Celkem přes referral</div>
            </div>
          </section>

          <section class="two-col">
            <div class="card">
              <div class="label">Referral odkaz</div>
              <div class="linkbox">${escapeHtml(partner.referral_url || "Není nastaveno")}</div>

              <div style="height:18px"></div>

              <div class="label">Slevový kód</div>
              <div class="code">${escapeHtml(partner.discount_code || "Není nastaveno")}</div>

              <div style="height:22px"></div>

              <div class="label">Poslední objednávka</div>
              <div class="last-order">
                <div class="mini">
                  <div class="helper">Datum</div>
                  <strong>${escapeHtml(lastOrder.at || "Zatím žádná")}</strong>
                </div>
                <div class="mini">
                  <div class="helper">Typ služby</div>
                  <strong>${escapeHtml(serviceName(lastOrder.type))}</strong>
                </div>
                <div class="mini">
                  <div class="helper">Provize</div>
                  <strong>${money(lastOrder.commission_amount)}</strong>
                </div>
              </div>
            </div>

            <div class="card">
              <div class="label">Zprávy</div>
              ${messageHtml}
            </div>
          </section>
        `
      } catch (err) {
        content.className = "status error"
        content.textContent = err.message
      }
    }

    loadDashboard()
  </script>
</body>
</html>
